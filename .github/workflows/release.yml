name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '!*b*'
      - '!*beta*'

jobs:
  build-core:
    name: Build identa-core 🐍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "packages/identa-core/.python-version"
      - name: Inject Dynamic Version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python -c "
          import re
          version = '$VERSION'
          with open('packages/identa-core/pyproject.toml', 'r') as f: data = f.read()
          data = re.sub(r'^version\s*=\s*[\"\'].*?[\"\']', f'version = \"{version}\"', data, flags=re.MULTILINE)
          with open('packages/identa-core/pyproject.toml', 'w') as f: f.write(data)
          "
      - name: Build identa-core
        working-directory: packages/identa-core
        run: uv build --out-dir dist
      - name: Store identa-core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: identa-core-dist
          path: packages/identa-core/dist/
          retention-days: 1

  publish-core:
    name: Publish identa-core to PyPI
    needs: build-core
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Download identa-core artifacts
        uses: actions/download-artifact@v4
        with:
          name: identa-core-dist
          path: packages/identa-core/dist/
      - name: Publish identa-core to PyPI
        working-directory: packages/identa-core
        run: uv publish

  build-sdk:
    name: Build identa-sdk 🐍
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PyPI propagation
        run: sleep 30
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "packages/identa-core/.python-version"
      - name: Inject Dynamic Version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python -c "
          import re
          version = '$VERSION'
          with open('packages/identa-sdk/pyproject.toml', 'r') as f: data = f.read()
          data = re.sub(r'^version\s*=\s*[\"\'].*?[\"\']', f'version = \"{version}\"', data, flags=re.MULTILINE)
          data = re.sub(r'([\"\'])identa-core([=><~^][^\"\']*)?([\"\'])', f'\g<1>identa-core=={version}\g<3>', data)
          data = re.sub(r'(identa-core\s*=\s*\{.*?version\s*=\s*)[\"\'].*?[\"\']', f'\g<1>\"{version}\"', data)
          with open('packages/identa-sdk/pyproject.toml', 'w') as f: f.write(data)
          "
      - name: Build identa-sdk
        working-directory: packages/identa-sdk
        run: uv build --out-dir dist
      - name: Store identa-sdk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: identa-sdk-dist
          path: packages/identa-sdk/dist/
          retention-days: 1

  publish-sdk:
    name: Publish identa-sdk to PyPI
    needs: build-sdk
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Download identa-sdk artifacts
        uses: actions/download-artifact@v4
        with:
          name: identa-sdk-dist
          path: packages/identa-sdk/dist/
      - name: Publish identa-sdk to PyPI
        working-directory: packages/identa-sdk
        run: uv publish
