name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    permissions:
      # This permission is required for Trusted Publishing
      id-token: write
      # This is required for actions/checkout
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build distributions
      run: |
        uv build --package identa-core --out-dir dist/core
        uv build --package identa-sdk --out-dir dist/sdk

    - name: Publish identa-core to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/core/
        skip-existing: true

    - name: Publish identa-sdk to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/sdk/
        skip-existing: true
