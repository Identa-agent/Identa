name: Test

on:
  push:
    branches: [ main, feature/*, feature-dift-update ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Set up Python
        run: uv python install 3.14.3
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run Core tests
        run: uv run python -m pytest packages/identa-core/tests/ -v
        
      - name: Run SDK tests
        run: uv run python -m pytest packages/identa-sdk/tests/ -v
        
      - name: Run E2E tests
        run: uv run python -m pytest tests/ -v
