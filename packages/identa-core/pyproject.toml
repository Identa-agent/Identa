[project]
name = "identa-core"
version = "0.1.0"
description = "Core domain and application logic for Identa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typing-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identa"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
