[project]
name = "identa-core"
dynamic = ["version"]
description = "Core domain and application logic for Identa"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0.49",
    "typing-extensions",
]

[tool.hatch.version]
source = "vcs"
path = "../../"

[project.optional-dependencies]
mlflow = ["mlflow>=2.10.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identa"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
