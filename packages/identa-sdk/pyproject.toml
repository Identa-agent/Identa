[project]
name = "identa-sdk"
version = "0.1.0"
description = "SDK for Identa - Agent Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "identa-core",
    "click",
    "langgraph>=1.1.9",
    "langchain>=1.2.15",
    "pydantic-ai>=1.86.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identa"]

[tool.uv.sources]
identa-core = { workspace = true }
