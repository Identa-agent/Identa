[project]
name = "identa-sdk"
dynamic = ["version"]
description = "SDK for Identa - Agent Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "identa-core",
    "click>=8.0.0,<9.0.0",
    "toml>=0.10.0,<1.0.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[project.optional-dependencies]
langgraph  = ["langgraph>=1.1.9"]
langchain  = ["langchain>=1.2.15"]
pydantic-ai = ["pydantic-ai>=1.86.1"]
postgres = ["psycopg2-binary>=2.9.0"]
all = [
    "langgraph>=1.1.9",
    "langchain>=1.2.15",
    "pydantic-ai>=1.86.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
identa = "identa.sdk.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["identa"]

[tool.uv.sources]
identa-core = { workspace = true }
