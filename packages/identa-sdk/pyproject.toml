[project]
name = "identa-sdk"
version = "0.4.8"
description = "SDK for Identa - Agent Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "identa-core>=0.4.8",
    "click",
    "toml",
]

[project.optional-dependencies]
langgraph  = ["langgraph>=1.1.9"]
langchain  = ["langchain>=1.2.15"]
pydantic-ai = ["pydantic-ai>=1.86.1"]
all = [
    "langgraph>=1.1.9",
    "langchain>=1.2.15",
    "pydantic-ai>=1.86.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
identa = "identa.sdk.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["identa"]

[tool.uv.sources]
identa-core = { workspace = true }
